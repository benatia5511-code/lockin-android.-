name: Build LOCKIN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lockin-native-android (3).zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "lockin-native-android (3).zip" -d android-project
          echo "Files extracted:"
          find android-project -maxdepth 4 -type f -name gradlew

      - name: Build debug APK
        run: |
          GRADLEW="$(find android-project -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "ZIP contents:"
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
